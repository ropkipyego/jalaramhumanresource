# Production compose — same as docker-compose.prod.yml (preserves existing volume).
# Use: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# NEVER use FRESH_DB=1 on production.

services:
  postgres:
    ports: []

  redis:
    ports: []

  minio:
    ports: []

  postgrest:
    ports: []

  backend:
    ports: []
    environment:
      NODE_ENV: production

  frontend:
    ports: []

  nginx:
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8081}:80"
